name: Supply Chain Security Scan

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@e8b464413e5cdbf8b2fc42a4c32dd7ca29f28bfa # v2.0.2
        with:
          scan-args: |-
            --recursive
            .
